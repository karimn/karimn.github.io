project:
  type: website
  output-dir: docs
  render:
    - "index.qmd"
    - "about.qmd"
    - "projects.qmd"
    - "research.qmd"
    - "writing/index.qmd"
    - "writing/funder-meta-problem.qmd"
    - "writing/lfo-beyond-time-series.qmd"
    - "writing/forecasting-trials-before-they-finish.qmd"
  post-render:
    - lualatex -interaction=nonstopmode -output-directory=docs cv.tex
    - lualatex -interaction=nonstopmode -output-directory=docs resume.tex

website:
  title: "Karim Naguib"
  description: "Economist and applied Bayesian statistician — hierarchical models for longitudinal and survival data. Digital-twin oncology tumor dynamics, most recently at AstraZeneca; prior work in development economics, real-estate market design, and reinforcement learning."
  site-url: "https://karimn.github.io"
  open-graph:
    image: "/og-image.png"
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - href: projects.qmd
        text: Projects
      - href: research.qmd
        text: Research
      - href: writing/index.qmd
        text: Writing
    right:
      - text: "CV"
        href: cv.pdf
    tools:
      - icon: linkedin
        href: https://www.linkedin.com/in/karnag
      - icon: github
        href: https://www.github.com/karimn
      - icon: envelope
        href: mailto:karimn2.0@pm.me
  page-footer:
    left: "© Karim Naguib — Built with Quarto & Claude Code"
    right: "[karimn2.0@pm.me](mailto:karimn2.0@pm.me)"

format:
  html:
    theme:
      - theme.scss
    css: styles.css
    toc: false
    page-layout: article
    anchor-sections: false
    title-block-style: none
    include-in-header: _goatcounter.html
